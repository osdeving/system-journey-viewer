<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Smart fulfillment same-day dispatch animated journey">
  <defs>
    <linearGradient id="fulfillmentBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="fulfillmentShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#431407" flood-opacity="0.15"/>
    </filter>
    <path id="fulfillmentMainPath" d="M142 205 C270 178 352 178 462 210 S638 252 758 214 S916 174 1012 218 S1110 352 1018 444 S774 500 616 452 S418 430 292 512"/>
    <path id="fulfillmentThreadPath" d="M760 216 C842 302 912 330 1004 300 S1118 282 1164 352"/>
  </defs>
  <rect width="1280" height="720" fill="url(#fulfillmentBg)"/>
  <text x="64" y="80" fill="#431407" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Smart Fulfillment Network</text>
  <text x="64" y="116" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="18">Same-day Dispatch with Parallel Warehouse Work</text>
  <g fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.82">
    <use href="#fulfillmentMainPath"/>
  </g>
  <g fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10" opacity="0.86">
    <use href="#fulfillmentThreadPath"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" filter="url(#fulfillmentShadow)">
    <g transform="translate(142 205)">
      <rect x="-98" y="-42" width="196" height="84" rx="8" fill="#1e293b"/>
      <text y="6" fill="#f8fafc">Storefront</text>
    </g>
    <g transform="translate(462 210)">
      <rect x="-104" y="-44" width="208" height="88" rx="8" fill="#2563eb"/>
      <text y="6" fill="#ffffff">Order API</text>
    </g>
    <g transform="translate(758 214)">
      <rect x="-128" y="-50" width="256" height="100" rx="8" fill="#ea580c"/>
      <text y="6" fill="#fff7ed">Orchestrator</text>
    </g>
    <g transform="translate(1012 218)">
      <path d="M-176 -44 H132 A30 44 0 0 1 132 44 H-176 A30 44 0 0 0 -176 -44" fill="#334155"/>
      <path d="M132 -44 A30 44 0 0 1 132 44" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <text y="6" fill="#f8fafc">Warehouse Event Bus</text>
    </g>
    <g transform="translate(1018 444)">
      <rect x="-112" y="-44" width="224" height="88" rx="8" fill="#0f766e"/>
      <text y="6" fill="#f0fdfa">Warehouse Mgmt</text>
    </g>
    <g transform="translate(616 452)">
      <path d="M-100 -42 H100 A30 42 0 0 1 100 42 H-100 A30 42 0 0 0 -100 -42" fill="#1e293b"/>
      <path d="M100 -42 A30 42 0 0 1 100 42" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <text y="6" fill="#e2e8f0">Inventory DB</text>
    </g>
    <g transform="translate(292 512)">
      <rect x="-104" y="-42" width="208" height="84" rx="8" fill="#475569"/>
      <text y="6" fill="#f8fafc">Carrier API</text>
    </g>
    <g transform="translate(1164 352)">
      <rect x="-92" y="-40" width="184" height="80" rx="8" fill="#4f46e5"/>
      <text y="6" fill="#eef2ff">Robot Fleet</text>
    </g>
  </g>
  <circle r="13" fill="#f97316" stroke="#ffffff" stroke-width="5">
    <animateMotion dur="8.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#fulfillmentMainPath"/>
    </animateMotion>
  </circle>
  <circle r="10" fill="#22c55e" stroke="#ffffff" stroke-width="4">
    <animateMotion dur="4.5s" begin="2.4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#fulfillmentThreadPath"/>
    </animateMotion>
  </circle>
  <text x="64" y="658" fill="#7c2d12" font-family="Inter, Arial, sans-serif" font-size="18">Inventory, robot assignment, carrier booking, and operations metrics move in parallel</text>
</svg>
